[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodias"
version = "2.0.0a0"
description = "Modernized automation for DIAS workflows in computational chemistry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "rdkit>=2023.9.1",
]

[project.scripts]
autodias = "autodias.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
